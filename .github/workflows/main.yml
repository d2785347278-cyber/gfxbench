name: Manual Build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Target platform'
        required: true
        default: 'linux'
        type: choice
        options: [linux_wayland, linux_vulkan, linux_gl, windows_x64, windows_arm64, windows_x64_qt, both, android]

# 官方要求的核心环境变量
env:
  CONFIG: 'Release'
  WORKSPACE: ${{ github.workspace }}
  APPLICATION_TYPE: 'gui'                # 官方：带完整UI的可安装版本
  PLATFORM: 'android-arm64-v8a'          # 官方指定架构
  ANDROID_NDK_VERSION: '28.0.12674087'   # 官方测试通过的NDK版本
  ANDROID_API_LEVEL: '35'                # 官方指定API版本
  BUNDLE_DATA: 'true'                    # 强制打包GPU测试资源

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux_wayland
            os: ubuntu-22.04
            runner: ubuntu-22.04
          - platform: linux_vulkan
            os: ubuntu-22.04
            runner: ubuntu-22.04
          - platform: linux_gl
            os: ubuntu-22.04
            runner: ubuntu-22.04
          - platform: windows_x64
            os: windows-latest
            runner: windows-latest
          - platform: windows_arm64
            os: windows-latest
            runner: windows-latest
          - platform: windows_x64_qt
            os: windows-latest
            runner: windows-latest
          - platform: android
            os: ubuntu-22.04
            runner: ubuntu-22.04
    runs-on: ${{ matrix.runner }}
    steps:
      # 1. 拉取代码（仅拉取主仓库，无多余子模块操作）
      - name: Checkout GFXBench Source Code
        if: ${{ matrix.platform == 'android' }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 拉取完整提交历史，避免依赖缺失

      # 2. 安装Ubuntu基础依赖（官方要求的cmake/swig等）
      - name: Install Base Dependencies
        if: ${{ matrix.platform == 'android' }}
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            cmake build-essential ninja-build swig openjdk-17-jdk \
            curl ca-certificates unzip python-is-python3 ccache
          # 配置ccache加速（官方提到NDK支持）
          echo "NDK_CCACHE=$(which ccache)" >> $GITHUB_ENV

      # 3. 安装官方指定版本的Android SDK/NDK（修复许可接受管道破裂问题）
      - name: Install Android SDK/NDK (Official Versions)
        if: ${{ matrix.platform == 'android' }}
        run: |
          # 创建SDK目录
          mkdir -p $HOME/android-sdk
          export ANDROID_HOME=$HOME/android-sdk
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH

          # 下载并解压cmdline-tools
          curl -fsSL -o cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdline-tools.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest

          # 修复：显式输入7次"y"接受所有许可（避免管道破裂）
          echo -ne "y\ny\ny\ny\ny\ny\n" | sdkmanager --licenses > /dev/null 2>&1

          # 安装官方要求的所有组件
          sdkmanager --install \
            "ndk;${{ env.ANDROID_NDK_VERSION }}" \
            "build-tools;${{ env.ANDROID_API_LEVEL }}.0.0" \
            "platforms;android-${{ env.ANDROID_API_LEVEL }}" \
            "platform-tools" \
            "cmdline-tools;latest"

          # 设置官方要求的环境变量（传递到后续步骤）
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/${{ env.ANDROID_NDK_VERSION }}" >> $GITHUB_ENV
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "NG_CMAKE_TOOLCHAIN_FILE=$ANDROID_HOME/ndk/${{ env.ANDROID_NDK_VERSION }}/build/cmake/android.toolchain.cmake" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV

      # 4. 修复openssl-cmake依赖（带CMakeLists.txt验证）
      - name: Fix openssl-cmake Dependency (With CMakeLists.txt)
        if: ${{ matrix.platform == 'android' }}
        run: |
          # 创建3rdparty目录
          mkdir -p 3rdparty
          
          # 克隆带CMakeLists.txt的openssl-cmake仓库（可靠源）
          if [ ! -d "3rdparty/openssl-cmake" ]; then
            git clone https://github.com/janbar/openssl-cmake.git 3rdparty/openssl-cmake
          fi

          # 关键验证：确保CMakeLists.txt存在，否则终止构建
          if [ ! -f "3rdparty/openssl-cmake/CMakeLists.txt" ]; then
            echo "ERROR: CMakeLists.txt not found in openssl-cmake directory!"
            exit 1
          fi
          echo "SUCCESS: openssl-cmake with CMakeLists.txt is ready."

      # 5. 构建第三方库（官方第一步：build-3rdparty.sh）
      - name: Build 3rdparty Libraries (Official Step 1)
        if: ${{ matrix.platform == 'android' }}
        run: |
          # 导出所有必要环境变量
          export WORKSPACE=${{ github.workspace }}
          export PLATFORM=${{ env.PLATFORM }}
          export CONFIG=${{ env.CONFIG }}
          export APPLICATION_TYPE=${{ env.APPLICATION_TYPE }}
          export BUNDLE_DATA=${{ env.BUNDLE_DATA }}
          
          # 执行官方第三方库构建脚本
          ./scripts/build-3rdparty.sh

      # 6. 构建GFXBench主程序（官方第二步：build.sh）
      - name: Build GFXBench Main Program (Official Step 2)
        if: ${{ matrix.platform == 'android' }}
        run: |
          # 导出所有必要环境变量
          export WORKSPACE=${{ github.workspace }}
          export PLATFORM=${{ env.PLATFORM }}
          export CONFIG=${{ env.CONFIG }}
          export APPLICATION_TYPE=${{ env.APPLICATION_TYPE }}
          export BUNDLE_DATA=${{ env.BUNDLE_DATA }}
          
          # 执行官方主构建脚本
          ./scripts/build.sh

          # 打印APK路径（方便排查，官方APK在tfw-pkg目录）
          echo "=== Generated APK Files ==="
          find ${{ github.workspace }} -name "*.apk" -type f
          ls -la ${{ github.workspace }}/tfw-pkg/

      # 7. 上传APK（官方指定路径：tfw-pkg）
      - name: Upload GFXBench Android APK
        if: ${{ matrix.platform == 'android' }}
        uses: actions/upload-artifact@v4
        with:
          name: GFXBench-Android-ARM64-APK-${{ github.run_id }}
          # 匹配官方APK输出目录，排除无关文件
          path: |
            ${{ github.workspace }}/tfw-pkg/**/*.apk
            !${{ github.workspace }}/3rdparty/**/*.apk
          retention-days: 30  # APK保留30天
          if-no-files-found: warn  # 未找到文件仅警告，方便排查
