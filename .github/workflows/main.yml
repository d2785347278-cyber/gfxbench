name: Build GFXBench Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        submodules: recursive  # 这很重要！GFXBench需要子模块

    - name: Setup Android Build Environment
      uses: android-actions/setup-android@v2

    - name: Install Build Tools
      run: |
        # 设置Java环境
        sudo apt-get update
        sudo apt-get install -y openjdk-17-jdk
        
        # 安装CMake和构建工具
        sudo apt-get install -y cmake ninja-build swig
        
        # 显示版本信息
        java -version
        cmake --version
        swig -version
        
        echo "✅ 构建工具安装完成"

    - name: Build Third-party Libraries
      run: |
        cd $GITHUB_WORKSPACE
        
        # 设置环境变量
        export WORKSPACE=$PWD
        export PLATFORM=android-arm64-v8a
        export CONFIG=Release
        
        # 构建第三方库
        echo "开始构建第三方库..."
        bash scripts/build-3rdparty.sh
        
        echo "✅ 第三方库构建完成"
        
      env:
        ANDROID_NDK: ${{ env.ANDROID_NDK }}
        ANDROID_HOME: ${{ env.ANDROID_HOME }}

    - name: Build GFXBench APK
      run: |
        cd $GITHUB_WORKSPACE
        
        # 设置构建参数
        export WORKSPACE=$PWD
        export PLATFORM=android-arm64-v8a
        export CONFIG=Release
        export APPLICATION_TYPE=gui  # 构建完整GUI应用
        
        echo "开始构建APK..."
        bash scripts/build.sh
        
        echo "✅ APK构建完成"
        
        # 显示构建结果
        echo "查找生成的APK文件..."
        find . -name "*.apk" -type f | head -10
        
      env:
        ANDROID_NDK: ${{ env.ANDROID_NDK }}
        ANDROID_HOME: ${{ env.ANDROID_HOME }}

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v3
      with:
        name: GFXBench-Android-APK
        path: |
          **/*.apk
          tfw-pkg/
        if-no-files-found: warn
        retention-days: 7

    - name: Show Build Summary
      if: always()
      run: |
        echo "=== 构建总结 ==="
        echo "工作流已完成！"
        
        if [ -d "tfw-pkg" ]; then
          echo "✅ tfw-pkg目录已生成"
          ls -la tfw-pkg/ | head -10
        fi
        
        echo "APK文件可以在Artifacts中下载"
        echo "============================="
