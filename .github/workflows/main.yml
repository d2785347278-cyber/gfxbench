name: Build GFXBench Android APK
on:
  workflow_dispatch:
    inputs:
      build_arch:
        description: '选择架构'
        required: true
        default: 'android-arm64-v8a'
        type: choice
        options:
          - android-arm64-v8a
          - android-armv7a

env:
  CONFIG: 'Release'
  APPLICATION_TYPE: 'gui'
  ANDROID_NDK_VERSION: '28.0.12674087'
  ANDROID_API_LEVEL: '35'
  ANDROID_BUILD_TOOLS: '35.0.0'
  CMAKE_VERSION: '3.21.0'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    # 1. 下载你的GFXBench源代码
    - name: Checkout code
      uses: actions/checkout@v4
    
    # 2. 显示当前有什么文件（方便调试）
    - name: Show files
      run: |
        echo "📁 当前目录内容:"
        ls -la
        echo ""
        echo "📂 scripts目录:"
        ls -la scripts/ || echo "scripts目录不存在"
    
    # 3. 安装基本工具（修复版）
    - name: Setup basic tools
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          ninja-build \
          swig \
          ccache \
          openjdk-17-jdk \
          python3 \
          curl \
          unzip \
          zip \
          git
        
        # 安装官方要求的CMake 3.21
        echo "📦 安装CMake 3.21（官方要求）..."
        CMAKE_DIR="$HOME/cmake-3.21"
        wget -q https://github.com/Kitware/CMake/releases/download/v3.21.0/cmake-3.21.0-linux-x86_64.tar.gz
        tar -xzf cmake-3.21.0-linux-x86_64.tar.gz
        mv cmake-3.21.0-linux-x86_64 "$CMAKE_DIR"
        echo "$CMAKE_DIR/bin" >> $GITHUB_PATH
        
        # 验证版本
        echo "✅ 工具版本:"
        "$CMAKE_DIR/bin/cmake" --version
        swig -version
        java -version
    
    # 4. 安装Android SDK和NDK（重新设计的版本）
    - name: Install Android SDK/NDK
      run: |
        echo "🤖 安装Android开发环境..."
        
        # 创建Android SDK目录
        ANDROID_SDK_ROOT="$HOME/android-sdk"
        mkdir -p "$ANDROID_SDK_ROOT"
        
        # 设置环境变量
        echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
        echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
        
        echo "📥 下载Android命令行工具..."
        
        # 方法1：使用官方推荐的方式安装
        # 创建cmdline-tools目录
        CMDLINE_TOOLS_DIR="$ANDROID_SDK_ROOT/cmdline-tools"
        mkdir -p "$CMDLINE_TOOLS_DIR"
        
        # 下载命令行工具
        cd /tmp
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
        unzip -q commandlinetools-linux-11076708_latest.zip
        
        # 将解压的内容移动到cmdline-tools/latest
        mv cmdline-tools "$CMDLINE_TOOLS_DIR/latest"
        
        # 添加sdkmanager到PATH
        echo "$CMDLINE_TOOLS_DIR/latest/bin" >> $GITHUB_PATH
        
        # 验证sdkmanager是否存在
        echo "🔍 验证sdkmanager..."
        ls -la "$CMDLINE_TOOLS_DIR/latest/bin/sdkmanager" || echo "sdkmanager文件不存在"
        
        # 设置文件可执行权限
        chmod +x "$CMDLINE_TOOLS_DIR/latest/bin/"*
        
        # 检查PATH
        echo "当前PATH: $PATH"
        
        # 等待一下确保路径更新
        sleep 2
        
        # 检查sdkmanager是否可执行
        if [ -x "$CMDLINE_TOOLS_DIR/latest/bin/sdkmanager" ]; then
          echo "✅ sdkmanager找到并可执行"
          # 显示版本
          "$CMDLINE_TOOLS_DIR/latest/bin/sdkmanager" --version || true
        else
          echo "❌ sdkmanager不可执行或不存在"
          exit 1
        fi
        
        # 接受许可证（需要非交互模式）
        echo "📝 接受Android许可证..."
        yes | "$CMDLINE_TOOLS_DIR/latest/bin/sdkmanager" --licenses 2>&1 | tail -20 || echo "许可证接受可能有警告"
        
        # 安装必要的组件
        echo "📦 安装Android组件..."
        "$CMDLINE_TOOLS_DIR/latest/bin/sdkmanager" --install \
          "ndk;$ANDROID_NDK_VERSION" \
          "build-tools;$ANDROID_BUILD_TOOLS" \
          "platforms;android-$ANDROID_API_LEVEL" \
          "platform-tools"
        
        # 设置NDK路径
        ANDROID_NDK="$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK_VERSION"
        echo "ANDROID_NDK=$ANDROID_NDK" >> $GITHUB_ENV
        echo "NG_CMAKE_TOOLCHAIN_FILE=$ANDROID_NDK/build/cmake/android.toolchain.cmake" >> $GITHUB_ENV
        
        echo "✅ Android环境安装完成"
        echo "NDK路径: $ANDROID_NDK"
    
    # 5. 修复常见问题
    - name: Fix common issues
      run: |
        echo "🔧 修复常见问题..."
        
        # 给所有sh文件执行权限
        find . -name "*.sh" -exec chmod +x {} \; 2>/dev/null || true
        
        # 检查构建脚本
        echo "📋 检查构建脚本:"
        if [ -f "scripts/build-3rdparty.sh" ]; then
          echo "✅ 找到 build-3rdparty.sh"
          head -5 scripts/build-3rdparty.sh
        else
          echo "❌ 缺少 build-3rdparty.sh"
          echo "当前目录:"
          pwd
          ls -la
        fi
        
        if [ -f "scripts/build.sh" ]; then
          echo "✅ 找到 build.sh"
          head -5 scripts/build.sh
        else
          echo "❌ 缺少 build.sh"
        fi
    
    # 6. 执行官方构建步骤
    - name: Run official build steps
      env:
        PLATFORM: ${{ github.event.inputs.build_arch }}
        CONFIG: ${{ env.CONFIG }}
        APPLICATION_TYPE: ${{ env.APPLICATION_TYPE }}
        WORKSPACE: ${{ github.workspace }}
        BUNDLE_DATA: "true"
        ANDROID_NDK: ${{ env.ANDROID_NDK }}
        ANDROID_HOME: ${{ env.ANDROID_HOME }}
      run: |
        echo "🚀 开始构建GFXBench..."
        echo "架构: $PLATFORM"
        echo "配置: $CONFIG"
        echo "类型: $APPLICATION_TYPE"
        
        # 验证环境变量
        echo "🔍 环境变量检查:"
        echo "ANDROID_NDK: $ANDROID_NDK"
        echo "ANDROID_HOME: $ANDROID_HOME"
        echo "WORKSPACE: $WORKSPACE"
        
        # 第一步：构建第三方库
        echo "📦 第一步：构建第三方库"
        if [ -f "scripts/build-3rdparty.sh" ]; then
          bash scripts/build-3rdparty.sh 2>&1 | tee build-3rdparty.log
          
          if [ ${PIPESTATUS[0]} -eq 0 ]; then
            echo "✅ 第三方库构建完成"
          else
            echo "❌ 第三方库构建失败"
            echo "最后50行日志:"
            tail -50 build-3rdparty.log
            exit 1
          fi
        else
          echo "❌ 找不到 scripts/build-3rdparty.sh"
          exit 1
        fi
        
        # 第二步：构建主程序
        echo "📱 第二步：构建主程序"
        if [ -f "scripts/build.sh" ]; then
          bash scripts/build.sh 2>&1 | tee build-main.log
          
          if [ ${PIPESTATUS[0]} -eq 0 ]; then
            echo "✅ 主程序构建完成"
          else
            echo "❌ 主程序构建失败"
            echo "最后50行日志:"
            tail -50 build-main.log
            exit 1
          fi
        else
          echo "❌ 找不到 scripts/build.sh"
          exit 1
        fi
        
        # 检查APK
        echo "🔍 查找生成的APK文件..."
        APK_FOUND=false
        find . -name "*.apk" -type f | while read apk; do
          echo "📦 找到APK: $apk"
          ls -lh "$apk"
          APK_FOUND=true
          # 复制到工作区根目录
          cp "$apk" "$GITHUB_WORKSPACE/" 2>/dev/null || true
        done
        
        if [ "$APK_FOUND" = false ]; then
          echo "⚠️  没有找到APK文件，检查以下目录:"
          find . -type d \( -name "tfw*" -o -name "out*" \) | head -10
        fi
    
    # 7. 上传生成的APK
    - name: Upload APK artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: GFXBench-APK-${{ github.event.inputs.build_arch }}
        path: |
          ${{ github.workspace }}/*.apk
          ${{ github.workspace }}/tfw-pkg/
          ${{ github.workspace }}/out/build/*/
        retention-days: 7
        if-no-files-found: warn
