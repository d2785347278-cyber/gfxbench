name: Manual Build
on:
  workflow_dispatch:
    inputs:
      build_arch:
        description: '选择架构'
        required: true
        default: 'android-arm64-v8a'
        type: choice
        options:
          - android-arm64-v8a
          - android-armv7a

env:
  CONFIG: 'Release'
  APPLICATION_TYPE: 'gui'
  ANDROID_NDK_VERSION: '28.0.12674087'
  ANDROID_API_LEVEL: '35'
  ANDROID_BUILD_TOOLS: '35.0.0'
  CMAKE_VERSION: '3.21.0'  # 官方测试版本

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    # 1. 下载你的GFXBench源代码
    - name: Checkout code
      uses: actions/checkout@v4
    
    # 2. 安装基本工具（确保CMake 3.21）
    - name: Setup basic tools
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          ninja-build \
          swig \
          ccache \
          openjdk-17-jdk \
          python3 \
          curl \
          unzip \
          zip \
          git
        
        # 移除可能存在的CMake高版本（如果已经安装）
        sudo apt-get remove -y cmake cmake-data 2>/dev/null || true
        
        # 下载并安装官方要求的CMake 3.21
        echo "📦 安装CMake ${{ env.CMAKE_VERSION }}（官方要求）..."
        wget -q https://github.com/Kitware/CMake/releases/download/v${{ env.CMAKE_VERSION }}/cmake-${{ env.CMAKE_VERSION }}-linux-x86_64.tar.gz
        tar -xzf cmake-${{ env.CMAKE_VERSION }}-linux-x86_64.tar.gz
        
        # 将CMake安装到/usr/local
        sudo cp -r cmake-${{ env.CMAKE_VERSION }}-linux-x86_64/* /usr/local/
        
        # 清理
        rm -rf cmake-${{ env.CMAKE_VERSION }}-linux-x86_64*
        
        # 验证版本
        echo "✅ 工具版本:"
        cmake --version
        swig -version
        java -version
    
    # 3. 安装Android SDK和NDK
    - name: Install Android SDK/NDK
      run: |
        echo "🔧 安装Android开发环境..."
        
        # 创建目录
        mkdir -p ~/android-sdk
        export ANDROID_SDK_ROOT=~/android-sdk
        export ANDROID_HOME=~/android-sdk
        
        echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
        echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
        
        # 下载命令行工具
        echo "⬇️ 下载Android命令行工具..."
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
        
        # 创建目标目录
        mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
        
        # 直接解压到目标位置
        unzip -q cmdline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
        
        # 重命名解压出的目录为latest
        mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
        
        # 添加到PATH
        echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
        
        # 接受许可证
        echo "📝 接受Android许可证..."
        yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true
        
        # 安装官方要求的组件
        echo "📦 安装Android组件..."
        $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --install \
          "ndk;${{ env.ANDROID_NDK_VERSION }}" \
          "build-tools;${{ env.ANDROID_BUILD_TOOLS }}" \
          "platforms;android-${{ env.ANDROID_API_LEVEL }}" \
          "platform-tools" \
          "cmdline-tools;latest"
        
        # 设置环境变量
        export ANDROID_NDK="$ANDROID_SDK_ROOT/ndk/${{ env.ANDROID_NDK_VERSION }}"
        export NG_CMAKE_TOOLCHAIN_FILE="$ANDROID_NDK/build/cmake/android.toolchain.cmake"
        
        echo "ANDROID_NDK=$ANDROID_NDK" >> $GITHUB_ENV
        echo "NG_CMAKE_TOOLCHAIN_FILE=$NG_CMAKE_TOOLCHAIN_FILE" >> $GITHUB_ENV
        
        echo "✅ Android环境安装完成"
        echo "ANDROID_NDK路径: $ANDROID_NDK"
    
    # 4. 修复常见问题
    - name: Fix common issues
      run: |
        echo "🔧 修复常见问题..."
        
        # 给所有sh文件执行权限
        find . -name "*.sh" -exec chmod +x {} \; 2>/dev/null || true
        
        # 修复openssl-cmake依赖（如果需要）
        if [ ! -d "3rdparty/openssl-cmake" ] && [ -d "3rdparty" ]; then
          echo "📦 修复openssl-cmake依赖..."
          cd 3rdparty
          git clone --depth 1 https://github.com/janbar/openssl-cmake.git 2>/dev/null || true
          cd ..
        fi
        
        # 检查构建脚本
        echo "📋 检查构建脚本:"
        if [ -f "scripts/build-3rdparty.sh" ]; then
          echo "✅ 找到 build-3rdparty.sh"
        else
          echo "❌ 缺少 build-3rdparty.sh"
          exit 1
        fi
    
    # 5. 执行官方构建步骤
    - name: Run official build steps
      env:
        PLATFORM: ${{ github.event.inputs.build_arch }}
        CONFIG: ${{ env.CONFIG }}
        APPLICATION_TYPE: ${{ env.APPLICATION_TYPE }}
        WORKSPACE: ${{ github.workspace }}
        BUNDLE_DATA: "true"
        ANDROID_NDK: ${{ env.ANDROID_NDK }}
        ANDROID_HOME: ${{ env.ANDROID_HOME }}
        NG_CMAKE_TOOLCHAIN_FILE: ${{ env.NG_CMAKE_TOOLCHAIN_FILE }}
      run: |
        echo "🚀 开始构建GFXBench..."
        echo "架构: $PLATFORM"
        echo "配置: $CONFIG"
        echo "类型: $APPLICATION_TYPE"
        echo "Android NDK: $ANDROID_NDK"
        
        # 检查环境变量
        echo "🔍 环境检查:"
        printenv | grep -E "(PLATFORM|CONFIG|ANDROID|WORKSPACE|CMAKE)" || true
        
        # 第一步：构建第三方库
        echo "📦 第一步：构建第三方库"
        cd "$WORKSPACE"
        
        if [ -f "scripts/build-3rdparty.sh" ]; then
          # 执行构建
          bash scripts/build-3rdparty.sh
          
          if [ $? -eq 0 ]; then
            echo "✅ 第三方库构建完成"
          else
            echo "❌ 第三方库构建失败"
            exit 1
          fi
        else
          echo "❌ 找不到 scripts/build-3rdparty.sh"
          exit 1
        fi
        
        # 第二步：构建主程序
        echo "📱 第二步：构建主程序"
        
        if [ -f "scripts/build.sh" ]; then
          # 执行构建
          bash scripts/build.sh
          
          if [ $? -eq 0 ]; then
            echo "✅ 主程序构建完成"
          else
            echo "❌ 主程序构建失败"
            exit 1
          fi
        else
          echo "❌ 找不到 scripts/build.sh"
          exit 1
        fi
        
        # 检查APK
        echo "🔍 查找生成的APK文件..."
        find . -name "*.apk" -type f | while read apk; do
          echo "📦 找到APK: $apk"
          ls -lh "$apk"
        done
        
        # 检查输出目录
        echo "📁 检查输出目录:"
        find . -type d -name "tfw*" -o -name "out" 2>/dev/null | head -5
    
    # 6. 上传生成的APK
    - name: Upload APK artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: GFXBench-APK-${{ github.event.inputs.build_arch }}
        path: |
          ${{ github.workspace }}/tfw-pkg/
          ${{ github.workspace }}/out/build/*/testfw/
        retention-days: 7
        if-no-files-found: warn
