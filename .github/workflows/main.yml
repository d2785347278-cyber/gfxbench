name: Manual Build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Target platform'
        required: true
        default: 'linux'
        type: choice
        options: [linux_wayland, linux_vulkan, linux_gl, windows_x64, windows_arm64, windows_x64_qt, both, android]

env:
  CONFIG: 'Release'
  WORKSPACE: ${{ github.workspace }}
  # 官方要求的核心环境变量
  APPLICATION_TYPE: 'gui'  # 官方：gui是带完整UI的可安装版
  PLATFORM: 'android-arm64-v8a'  # 官方指定架构
  ANDROID_NDK_VERSION: '28.0.12674087'  # 官方测试通过的NDK版本
  ANDROID_API_LEVEL: '35'  # 官方指定API版本

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux_wayland
            os: ubuntu-22.04
            runner: ubuntu-22.04
          - platform: linux_vulkan
            os: ubuntu-22.04
            runner: ubuntu-22.04
          - platform: linux_gl
            os: ubuntu-22.04
            runner: ubuntu-22.04
          - platform: windows_x64
            os: windows-latest
            runner: windows-latest
          - platform: windows_arm64
            os: windows-latest
            runner: windows-latest
          - platform: windows_x64_qt
            os: windows-latest
            runner: windows-latest
          - platform: android
            os: ubuntu-22.04
            runner: ubuntu-22.04
    runs-on: ${{ matrix.runner }}
    steps:
      # 1. 拉取代码（官方无特殊子模块要求，仅拉取主代码）
      - name: Checkout code
        if: ${{ matrix.platform == 'android' }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. 安装官方要求的基础依赖
      - name: Install Base Dependencies (Ubuntu)
        if: ${{ matrix.platform == 'android' }}
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            cmake build-essential ninja-build swig openjdk-17-jdk \
            curl ca-certificates unzip python-is-python3 ccache
          # 配置ccache（官方提到NDK支持ccache加速）
          echo "NDK_CCACHE=$(which ccache)" >> $GITHUB_ENV

      # 3. 安装Android SDK/NDK（严格按官方版本）
      - name: Install Android SDK/NDK (Official Versions)
        if: ${{ matrix.platform == 'android' }}
        run: |
          # 创建SDK目录
          mkdir -p $HOME/android-sdk
          export ANDROID_HOME=$HOME/android-sdk
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH

          # 下载cmdline-tools
          curl -o cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdline-tools.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest

          # 接受SDK许可（非交互模式）
          yes | sdkmanager --licenses

          # 安装官方要求的组件
          sdkmanager --install \
            "ndk;${{ env.ANDROID_NDK_VERSION }}" \
            "build-tools;${{ env.ANDROID_API_LEVEL }}.0.0" \
            "platforms;android-${{ env.ANDROID_API_LEVEL }}" \
            "platform-tools" \
            "cmdline-tools;latest"

          # 设置官方要求的环境变量
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/${{ env.ANDROID_NDK_VERSION }}" >> $GITHUB_ENV
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "NG_CMAKE_TOOLCHAIN_FILE=$ANDROID_HOME/ndk/${{ env.ANDROID_NDK_VERSION }}/build/cmake/android.toolchain.cmake" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV

      # 4. 手动修复openssl-cmake依赖（官方build-3rdparty.sh的前置）
      - name: Fix openssl-cmake Dependency
        if: ${{ matrix.platform == 'android' }}
        run: |
          mkdir -p 3rdparty
          # 克隆带CMakeLists.txt的openssl-cmake（适配官方build-3rdparty.sh）
          if [ ! -d "3rdparty/openssl-cmake" ]; then
            git clone https://github.com/janbar/openssl-cmake.git 3rdparty/openssl-cmake
          fi

      # 5. 构建第三方库（官方第一步）
      - name: Build 3rdparty Libraries (Official Step 1)
        if: ${{ matrix.platform == 'android' }}
        run: |
          export BUNDLE_DATA=true  # 官方：打包测试数据
          export WORKSPACE=${{ github.workspace }}
          export PLATFORM=${{ env.PLATFORM }}
          export CONFIG=${{ env.CONFIG }}
          export APPLICATION_TYPE=${{ env.APPLICATION_TYPE }}
          
          # 执行官方的第三方库构建脚本
          ./scripts/build-3rdparty.sh

      # 6. 构建GFXBench主程序（官方第二步）
      - name: Build GFXBench (Official Step 2)
        if: ${{ matrix.platform == 'android' }}
        run: |
          export BUNDLE_DATA=true
          export WORKSPACE=${{ github.workspace }}
          export PLATFORM=${{ env.PLATFORM }}
          export CONFIG=${{ env.CONFIG }}
          export APPLICATION_TYPE=${{ env.APPLICATION_TYPE }}
          
          # 执行官方的主构建脚本
          ./scripts/build.sh

          # 打印APK路径（官方说明：APK在tfw-pkg目录）
          find ${{ github.workspace }} -name "*.apk" -type f
          ls -la ${{ github.workspace }}/tfw-pkg/

      # 7. 上传APK（适配官方的输出路径tfw-pkg）
      - name: Upload Android APK (Official Path)
        if: ${{ matrix.platform == 'android' }}
        uses: actions/upload-artifact@v4
        with:
          name: GFXBench-Android-APK-${{ github.run_id }}
          # 官方说明：APK输出在tfw-pkg目录
          path: |
            ${{ github.workspace }}/tfw-pkg/**/*.apk
            !${{ github.workspace }}/3rdparty/**/*.apk
          retention-days: 30
          if-no-files-found: warn
