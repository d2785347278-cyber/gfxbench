name: Manual Build

on:
  workflow_dispatch:  # 手动触发
    inputs:
      build_arch:
        description: '选择架构'
        required: true
        default: 'android-arm64-v8a'
        type: choice
        options:
          - android-arm64-v8a
          - android-armv7a

env:
  CONFIG: 'Release'
  APPLICATION_TYPE: 'gui'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    # 1. 下载你的GFXBench源代码
    - name: Checkout code
      uses: actions/checkout@v4
    
    # 2. 显示当前有什么文件（方便调试）
    - name: Show files
      run: |
        echo "📁 当前目录内容:"
        ls -la
        echo ""
        echo "📂 scripts目录:"
        ls -la scripts/ || echo "scripts目录不存在"
    
    # 3. 安装基本工具
    - name: Setup basic tools
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          ninja-build \
          swig \
          ccache \
          openjdk-17-jdk \
          python3 \
          curl \
          unzip \
          zip
    
    # 4. 安装Android SDK和NDK（官方要求版本）
    - name: Install Android SDK/NDK
      run: |
        echo "🔧 安装Android开发环境..."
        
        # 创建目录
        mkdir -p ~/android-sdk
        export ANDROID_SDK_ROOT=~/android-sdk
        export ANDROID_HOME=~/android-sdk
        
        # 下载命令行工具
        SDK_URL="https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
        curl -L -o cmdline-tools.zip "$SDK_URL"
        unzip -q cmdline-tools.zip -d "$ANDROID_SDK_ROOT"
        mv "$ANDROID_SDK_ROOT/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
        
        # 设置PATH
        echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
        echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH
        
        # 接受许可证
        yes | sdkmanager --licenses
        
        # 安装官方要求的组件（严格按版本）
        sdkmanager --install \
          "ndk;28.0.12674087" \
          "build-tools;35.0.0" \
          "platforms;android-35" \
          "platform-tools" \
          "cmdline-tools;latest"
        
        # 设置环境变量
        export ANDROID_NDK="$ANDROID_SDK_ROOT/ndk/28.0.12674087"
        export NG_CMAKE_TOOLCHAIN_FILE="$ANDROID_NDK/build/cmake/android.toolchain.cmake"
        
        echo "ANDROID_NDK=$ANDROID_NDK" >> $GITHUB_ENV
        echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
        echo "NG_CMAKE_TOOLCHAIN_FILE=$NG_CMAKE_TOOLCHAIN_FILE" >> $GITHUB_ENV
        
        echo "✅ Android环境安装完成"
    
    # 5. 修复常见问题
    - name: Fix common issues
      run: |
        echo "🔧 修复常见问题..."
        
        # 给所有sh文件执行权限
        find . -name "*.sh" -exec chmod +x {} \; 2>/dev/null || true
        
        # 检查是否有build脚本
        if [ -f "scripts/build-3rdparty.sh" ]; then
          echo "✅ 找到build-3rdparty.sh"
          chmod +x scripts/build-3rdparty.sh
        else
          echo "❌ 找不到build-3rdparty.sh，请检查仓库"
          ls -la scripts/
        fi
        
        if [ -f "scripts/build.sh" ]; then
          echo "✅ 找到build.sh"
          chmod +x scripts/build.sh
        else
          echo "❌ 找不到build.sh，请检查仓库"
        fi
    
    # 6. 执行官方构建步骤
    - name: Run official build steps
      env:
        PLATFORM: ${{ github.event.inputs.build_arch }}
        CONFIG: ${{ env.CONFIG }}
        APPLICATION_TYPE: ${{ env.APPLICATION_TYPE }}
        WORKSPACE: ${{ github.workspace }}
        BUNDLE_DATA: "true"
      run: |
        echo "🚀 开始构建GFXBench..."
        echo "架构: $PLATFORM"
        echo "配置: $CONFIG"
        echo "类型: $APPLICATION_TYPE"
        
        # 第一步：构建第三方库
        echo "📦 第一步：构建第三方库"
        bash scripts/build-3rdparty.sh 2>&1 | tee build-3rdparty.log
        
        if [ ${PIPESTATUS[0]} -ne 0 ]; then
          echo "❌ 第三方库构建失败"
          tail -50 build-3rdparty.log
          exit 1
        fi
        echo "✅ 第三方库构建完成"
        
        # 第二步：构建主程序
        echo "📱 第二步：构建主程序"
        bash scripts/build.sh 2>&1 | tee build-main.log
        
        if [ ${PIPESTATUS[0]} -ne 0 ]; then
          echo "❌ 主程序构建失败"
          tail -50 build-main.log
          exit 1
        fi
        echo "✅ 主程序构建完成"
        
        # 检查APK
        echo "🔍 查找生成的APK文件..."
        find . -name "*.apk" -type f | while read apk; do
          echo "📦 找到APK: $apk"
          ls -lh "$apk"
        done
        
        # 检查tfw-pkg目录（官方输出目录）
        if [ -d "tfw-pkg" ]; then
          echo "📁 tfw-pkg目录内容:"
          ls -la tfw-pkg/
        fi
    
    # 7. 上传生成的APK
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: GFXBench-APK
        path: |
          tfw-pkg/*.apk
          out/build/*/testfw/*.apk
          *.apk
        retention-days: 7
        if-no-files-found: warn
